name: Research artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replay, regenerate and cross-check
        run: bash scripts/verify.sh
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended
      - name: Compile with fresh references
        working-directory: paper
        run: |
          rm -f main.bbl main.pdf
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -E 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: paper/main.pdf
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.19.0 and check boundary rigidity
        run: |
          curl -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          cd "$RUNNER_TEMP"
          sha256sum -c "$GITHUB_WORKSPACE/verification/lean/toolchain.sha256"
          tar --zstd -xf lean.tar.zst
          ./lean-4.19.0-linux/bin/lean "$GITHUB_WORKSPACE/verification/lean/Boundary.lean"
